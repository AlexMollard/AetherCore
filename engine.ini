# AetherCore runtime settings
#
# Values accepted for booleans: true/false, on/off, yes/no, 1/0

[Graphics]
# Enable/disable Vulkan VSync (FIFO present mode).
# false requests IMMEDIATE present mode; if unsupported, engine falls back to FIFO.
VSync=false
FXAA=false
AsyncCompute=true

[Window]
Width=1920
Height=1080

[App]
# 0 = auto policy (sync to display when VSync on, uncapped when off)
TargetFPS=0
