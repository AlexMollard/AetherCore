name: Publish website

# Manual only. The one-day Pages artifact is the only approved upload.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check website entry points
        shell: bash
        run: |
          test -f website/index.html
          test -f website/.nojekyll

      - name: Upload website for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
          retention-days: 1

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
