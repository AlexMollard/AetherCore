name: CI

# The gauntlet already knows about CI: it reads $env:CI and folds itself down to
# build + unit, because the editor and runtime smokes need a GPU and a display that
# hosted runners do not have. Those two phases stay a local pre-merge step - see
# scripts/Run-DebugGauntlet.ps1.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pull requests share one group per branch, so a newer push supersedes the older run:
  # nobody merges the middle commit, and the Windows job is far too expensive to leave
  # duplicates running.
  #
  # Master gets a group PER COMMIT, so master runs never contend with each other at all.
  # Two separate mechanisms would otherwise drop them. cancel-in-progress kills runs that
  # have started - that is what the ref check below turns off. But a run still WAITING is
  # dropped by a second rule that keeps only the newest pending run per group, which
  # cancel-in-progress has no say over; three consecutive master commits were lost that way
  # even after the first fix. A unique group per SHA is the only thing that answers both.
  #
  # The cost is that several hour-long Windows jobs can run at once during an active
  # session. That is the trade: every commit on master is a commit someone can build from,
  # so every one of them gets built.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Cheap, fast, and independent of the build: architectural rules and formatting.
  # Split out so a boundary regression reports in about a minute instead of waiting
  # on a full compile.
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: GPU abstraction guard
        shell: pwsh
        run: ./scripts/check-gpu-abstraction.ps1

  build-and-test:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Chocolatey ships on windows-latest, so this avoids depending on a
      # third-party action for the one step the whole build rests on. Choco sets
      # VULKAN_SDK as a machine variable, which a later step does not inherit - so
      # export it explicitly, or find_package(Vulkan) searches a bare "/include".
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction Stop |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found under C:\VulkanSDK after install' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # slangc lives in the SDK's Bin; the shader step needs it on PATH.
          "$($sdk.FullName)\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "VULKAN_SDK=$($sdk.FullName)"

      # CPM fetches every third-party dependency from git on a cold tree, which
      # dominates a first configure. Keyed on the dependency manifest so it only
      # re-fetches when that actually changes.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # windows-latest is now windows-2025-vs2026, which has no VS 2022 - so the
      # `default` preset's "Visual Studio 17 2022" generator cannot be found. Use the
      # matching preset the repo already ships rather than pinning to a retiring image.
      - name: Configure
        run: cmake --preset vs2026-msvc
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

      - name: Build
        run: cmake --build --preset vs2026-msvc --target Editor GameRuntime EngineTests

      # The gauntlet sees $env:CI (GitHub sets it) and skips the two GPU smokes on
      # its own, so this is the same entry point used locally rather than a second,
      # drifting definition of "what CI runs".
      - name: Gauntlet (build + unit)
        shell: pwsh
        run: ./scripts/Run-DebugGauntlet.ps1 -BuildDir build/vs2026-msvc -Config RelWithDebInfo -SkipBuild

      - name: Upload the gauntlet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-report
          path: build/vs2026-msvc/gauntlet-report.json
          if-no-files-found: ignore
