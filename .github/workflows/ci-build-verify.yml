# Build verification for master and its PRs.
#
# The stock cmake-multi-platform.yml installs no dependencies, so it never
# actually builds (it dies at find_package(Vulkan)). This workflow installs the
# real toolchain (CMake 4, the Vulkan SDK - which also provides slangc - plus the
# Linux window-system dev libs GLFW needs) and actually compiles the engine.
#
# The Windows job runs scripts/Run-DebugGauntlet.ps1 in -CI mode, which builds
# App + GameRuntime + EngineTests AND runs the unit suite. Building every target
# (not just the default) plus running the tests is what catches regressions the
# old build-only CI missed - e.g. a GameRuntime-only compile break, or a failing
# test. The GPU validation smokes the gauntlet also contains are skipped in CI
# (runners have no GPU/display); they run locally via the same script.
name: CI build verify

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (gcc-14, C++23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build gcc-14 g++-14 \
            libvulkan-dev vulkan-tools glslang-tools \
            xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols libxrandr-dev

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DAETHERCORE_ENABLE_SLANG=OFF
          -DAETHERCORE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

  windows:
    name: Windows (MSVC, C++23)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Configure
        run: >
          cmake -S . -B build
          -DAETHERCORE_ENABLE_SLANG=OFF
          -DAETHERCORE_BUILD_TESTS=ON

      # Build App + GameRuntime + EngineTests and run the unit suite. -CI skips
      # the GPU validation smokes (no GPU/display on the runner). This is the step
      # that fails on a GameRuntime-only compile break or a failing test.
      - name: Gauntlet (build all targets + unit tests)
        shell: pwsh
        run: ./scripts/Run-DebugGauntlet.ps1 -BuildDir build -Config Release -CI
