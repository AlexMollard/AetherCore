# GPU abstraction guard
#
# A cheap pre-merge check that enforces the gpu/vulkan two-layer
# abstraction documented in docs/plans/gpu-abstraction-rendering-audit.md
# (audit §7, Priority 7). The audit's rule is:
#
#   "Engine-side code (outside src/engine/vulkan/) must contain zero vk*
#    tokens; all resource lifetime managed through gpu::ResourceRegistry
#    and typed handles. No vk* calls, no gpu::ToVk, no static_cast<Vk*>
#    in non-vulkan dir files."
#
# We extend that to also disallow:
#   * <vulkan/*> / volk.hpp / vk_mem_alloc.h includes in pure engine code
#     (gpu/ is the boundary layer; vulkan/ is the backend).
#   * Trivially detectable Vk* type-name usage in non-gpu/non-vulkan
#     engine TUs.
#   * Direct vk* function calls in non-gpu/non-vulkan engine TUs.
#
# When this job fails, the engine is leaking a Vulkan token outside the
# backend. The fix is always to introduce a typed handle in `gpu/`
# (or move the offending code into `vulkan/`).
name: GPU abstraction guard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # Allow sub-second local invocation of the same checks via
  # `pwsh scripts/check-gpu-abstraction.ps1`. The script must produce
  # zero output and exit 0 on a clean tree.
  check:
    name: No vk* tokens in engine code outside vulkan/
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install ripgrep
      run: sudo apt-get update && sudo apt-get install -y ripgrep

    - name: Run gpu-abstraction grep gate
      shell: pwsh
      run: |
        # The list of engine dirs that must remain vulkan-free. These
        # match the audit doc's "non-gpu, non-vulkan" category.
        $engineDirs = @(
          'src/engine/rendering',
          'src/engine/passes',
          'src/engine/ui',
          'src/engine/physics',
          'src/engine/material',
          'src/engine/mesh',
          'src/engine/text',
          'src/engine/assets',
          'src/engine/animation',
          'src/engine/scene',
          'src/engine/utils',
          'src/engine/camera',
          'src/engine/platform',
          'src/engine/io',
          'src/engine/AetherCore.cpp',
          'src/engine/AetherCore.hpp'
        )

        $failed = $false

        # 1. No non-gpu, non-vulkan engine TU includes <vulkan/*>, volk.hpp,
        #    or vk_mem_alloc.h.
        $includes = rg -l 'volk\.hpp|<vulkan/|vk_mem_alloc\.h' @engineDirs
        if ($includes) {
          Write-Host '::error::Engine code outside gpu/ or vulkan/ must not include Vulkan headers.'
          Write-Host 'Offending files:'
          $includes | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 1b. No gpu/*.hpp header (the public surface of the GPU facade)
        #     includes any Vulkan header. Boundary-layer .cpp files are
        #     allowed (they implement the cast at the seam), but headers
        #     must stay vulkan-free so engine TUs that consume them never
        #     see a Vulkan token.
        $gpuHeaderDir = 'src/engine/gpu'
        $gpuHeaderIncludes = @()
        if (Test-Path $gpuHeaderDir) {
          Get-ChildItem -Path $gpuHeaderDir -Filter '*.hpp' -Recurse | ForEach-Object {
            $h = $_
            $content = Get-Content $h.FullName -Raw
            $lines = $content -split "`n"
            for ($i = 0; $i -lt $lines.Length; $i++) {
              $line = $lines[$i]
              if ($line -match '^\s*#\s*include\s*[<"]?(volk\.hpp|<vulkan/|vk_mem_alloc\.h)') {
                $gpuHeaderIncludes += "$($h.FullName):$($i+1): $line"
              }
            }
          }
        }
        if ($gpuHeaderIncludes) {
          Write-Host '::error::gpu/*.hpp headers must not include Vulkan headers (public surface must stay vulkan-free).'
          Write-Host 'Offending files:'
          $gpuHeaderIncludes | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 2. No architectural static_cast<Vk*> in non-gpu/non-vulkan code.
        $casts = rg 'static_cast<Vk(Buffer|Image|ImageView|CommandBuffer|Pipeline|PipelineLayout|Device|DescriptorSet|DescriptorSetLayout|Queue|CommandPool|Sampler)' @engineDirs
        if ($casts) {
          Write-Host '::error::Engine code outside gpu/ or vulkan/ must not static_cast<Vk*>.'
          Write-Host 'Offending matches:'
          $casts | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 2b. No static_cast<Vk*> or reinterpret_cast<Vk*> in gpu/ at all.
        #     The gpu/ dir is the engine-side facade; the cast must stay
        #     in vulkan/. Boundary-layer .cpp files were moved out of gpu/
        #     for exactly this reason. Filter comment-only lines (//) so
        #     header documentation that references these casts in passing
        #     does not trigger the check. rg output on Windows is
        #     `<path>:<line>:<content>`. We split on the second colon to
        #     extract the content.
        $gpuCastsRaw = rg -n '(static_cast|reinterpret_cast)<Vk(Buffer|Image|ImageView|CommandBuffer|Pipeline|PipelineLayout|Device|DescriptorSet|DescriptorSetLayout|Queue|CommandPool|Sampler)' src/engine/gpu
        $gpuCasts = @()
        foreach ($line in $gpuCastsRaw) {
          $firstColon = $line.IndexOf(':')
          if ($firstColon -lt 0) { continue }
          $rest = $line.Substring($firstColon + 1)
          $secondColon = $rest.IndexOf(':')
          if ($secondColon -lt 0) { continue }
          $content = $rest.Substring($secondColon + 1)
          if (-not $content.TrimStart().StartsWith('//')) {
            $gpuCasts += $line
          }
        }
        if ($gpuCasts) {
          Write-Host '::error::gpu/ must not contain static_cast<Vk*> or reinterpret_cast<Vk*>; the cast belongs in vulkan/.'
          Write-Host 'Offending matches:'
          $gpuCasts | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 3. No direct vk* function call in non-gpu/non-vulkan engine code.
        $calls = rg '\bvk[A-Z][a-zA-Z]+\(' @engineDirs
        if ($calls) {
          Write-Host '::error::Engine code outside gpu/ or vulkan/ must not call vk* functions directly.'
          Write-Host 'Offending matches:'
          $calls | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 4. The engine-side gpu::GpuProfiler header (gpu/GpuProfiler.hpp) must
        #    not contain any `Vk` token in code (a comment-only mention is
        #    allowed). Tracy types count as leaks too. Use rg with
        #    --field-match-separator so the output is `<lineno> <content>`
        #    (Windows paths have colons that confuse a naive split).
        $headerLeaks = rg -n --field-match-separator=' ' '\bVk[A-Z]\w*\b' src/engine/gpu/GpuProfiler.hpp |
          ForEach-Object {
            $trimmed = $_ -replace '^\s*\d+\s+', ''
            if ($trimmed.TrimStart().StartsWith('//')) { return }
            $_
          }
        if ($headerLeaks) {
          Write-Host '::error::gpu/GpuProfiler.hpp must not mention Vk* in code (comments are OK).'
          Write-Host 'Offending matches:'
          $headerLeaks | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        # 2c. No `vk` or `Vk` named identifiers (functions, variables,
        #     parameters) anywhere outside vulkan/ and gpu/. The gpu/ dir
        #     is allowed to have comments that reference vk* / Vk* types as
        #     documentation. Other engine dirs are completely forbidden.
        #     Filter comments.
        function Get-NonCommentLines([string[]]$raw) {
          $result = @()
          foreach ($line in $raw) {
            $firstColon = $line.IndexOf(':')
            if ($firstColon -lt 0) { continue }
            $rest = $line.Substring($firstColon + 1)
            $secondColon = $rest.IndexOf(':')
            if ($secondColon -lt 0) { continue }
            $content = $rest.Substring($secondColon + 1)
            if (-not $content.TrimStart().StartsWith('//')) {
              $result += $line
            }
          }
          return ,$result
        }

        $vkFuncCalls = Get-NonCommentLines (rg -n '\bvk[A-Z][a-zA-Z]+\(' src/engine --glob '!src/engine/vulkan/**' --glob '!src/engine/gpu/**')
        if ($vkFuncCalls) {
          Write-Host '::error::No vk* function calls outside vulkan/ and gpu/.'
          Write-Host 'Offending matches:'
          $vkFuncCalls | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        $vkIdents = Get-NonCommentLines (rg -n '\bvk[A-Z][a-zA-Z]+' src/engine --glob '!src/engine/vulkan/**' --glob '!src/engine/gpu/**')
        if ($vkIdents) {
          Write-Host '::error::No vk* identifier names outside vulkan/ and gpu/.'
          Write-Host 'Offending matches:'
          $vkIdents | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        $VkIdents = Get-NonCommentLines (rg -n '\bVk[A-Z]\w*' src/engine --glob '!src/engine/vulkan/**' --glob '!src/engine/gpu/**')
        if ($VkIdents) {
          Write-Host '::error::No Vk* identifier names outside vulkan/ and gpu/.'
          Write-Host 'Offending matches:'
          $VkIdents | ForEach-Object { Write-Host "  $_" }
          $failed = $true
        }

        if ($failed) {
          exit 1
        }
        Write-Host 'GPU abstraction gate: clean.'
