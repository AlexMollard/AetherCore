name: Release

# Builds the redistributable editor and attaches it to a GitHub Release.
#
# The point of this workflow is that the machine it runs on has never seen this repository
# before. That is not incidental - it is the only environment that actually proves the
# package is self-contained, because a developer's machine will happily satisfy a missing
# file from the source tree the binaries were built from. If the editor works here, it
# works for someone who only downloaded it.
#
# MANUAL ONLY - pushing a tag does NOT start a build. Run it from the Actions tab and
# select the tag as the ref to publish that release; run it from a branch to build the
# artifacts without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build (no release is created)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $version = '${{ inputs.version }}'
            if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0-dev' }
          }
          # Inno Setup's AppVersion will not accept a prerelease suffix, so keep a
          # numeric-only form for it alongside the full name used for the release.
          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+(\.\d+){0,3}$') { $numeric = '0.0.0' }
          "version=$version"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "numeric=$numeric"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version numeric=$numeric"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Same approach as ci.yml: choco ships on the runner, and VULKAN_SDK is set as a
      # machine variable that a later step does not inherit, so export it explicitly.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction Stop |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found under C:\VulkanSDK after install' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$($sdk.FullName)\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # Ninja + sccache: see the note in ci.yml. The Visual Studio generator ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER, so a compiler cache cannot attach to it.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake --preset ci-windows-release -DAETHERCORE_BUILD_EDITOR=ON -DAETHERCORE_BUILD_LAUNCHER=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
          SCCACHE_GHA_ENABLED: "true"

      # Release, not RelWithDebInfo: AE_DEV_TOOLING gates the validation layer and the
      # editor's other development-only cost to the debug configurations, so a shipped
      # editor must not be built in one of them.
      - name: Build
        # --parallel: see the note in ci.yml. Without it MSBuild builds one project at a
        # time and the build step dominates the whole run.
        run: cmake --build --preset ci-windows-release --target Editor GameRuntime Launcher EngineTests
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: sccache stats
        run: sccache --show-stats

      # Nothing should be published that has not been tested. The GPU smokes need a
      # display the runner does not have, so this is the unit suite only - the same
      # boundary ci.yml draws.
      - name: Unit tests
        run: build/ci-windows-release/tests/EngineTests.exe

      - name: Stage the redistributable
        run: cmake --install build/ci-windows-release --component Runtime --prefix "${{ github.workspace }}/staging"

      # A bundled runtime is what lets the editor start on a machine with no .NET at all;
      # DotNetHost points hostfxr at this directory when it exists. The SDK is a separate
      # matter - it is only needed to COMPILE a project's scripts, is far larger, and the
      # editor detects and reports its absence at runtime.
      - name: Bundle the .NET runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          # A separate process because the script calls exit, which would otherwise end
          # this step's shell before the later commands run.
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\dotnet-install.ps1" `
              -Runtime dotnet -Channel 10.0 -InstallDir "${{ github.workspace }}\staging\dotnet" -NoPath
          $runtimes = Get-ChildItem "${{ github.workspace }}\staging\dotnet\shared\Microsoft.NETCore.App" -Directory -ErrorAction SilentlyContinue
          if (-not $runtimes) { throw 'No runtime was staged into staging/dotnet' }
          Write-Host "Bundled runtime: $($runtimes.Name -join ', ')"

      - name: Verify the package is self-contained
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PayloadDir "${{ github.workspace }}/staging" -RequireBundledRuntime

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DPayloadDir=${{ github.workspace }}\staging" `
                  "/DAppVersion=${{ steps.version.outputs.numeric }}" `
                  "/O${{ github.workspace }}\dist" `
                  packaging\AetherCore.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Build the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}\dist" | Out-Null
          Compress-Archive -Path "${{ github.workspace }}\staging\*" `
                           -DestinationPath "${{ github.workspace }}\dist\AetherCore-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-win-x64
          path: dist/*

      # `gh` ships on the runner and only needs GITHUB_TOKEN, so publishing costs no
      # third-party action with write access to the repository.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist | ForEach-Object { $_.FullName }) `
            --title "AetherCore ${{ steps.version.outputs.version }}" `
            --generate-notes
