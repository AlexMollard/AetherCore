name: Release

# Builds private redistributable artifacts. This workflow never publishes a release.
#
# Hosted build/staging checks do not qualify GUI/GPU behavior or a clean standard-user
# installation. Run the relocated product and VM gates separately and retain evidence.
#
# MANUAL ONLY - pushing a tag does NOT start a build. Run it from the Actions tab and
# select the source ref to build private artifacts without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build (no release is created)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $version = '${{ inputs.version }}'
            if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0-dev' }
          }
          # Inno Setup's AppVersion will not accept a prerelease suffix, so keep a
          # numeric-only form for it alongside the full name used for the release.
          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+(\.\d+){0,3}$') { $numeric = '0.0.0' }
          "version=$version"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "numeric=$numeric"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version numeric=$numeric"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same approach as ci.yml: choco ships on the runner, and VULKAN_SDK is set as a
      # machine variable that a later step does not inherit, so export it explicitly.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction Stop |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found under C:\VulkanSDK after install' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$($sdk.FullName)\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMake/Dependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      # Ninja + sccache: see the note in ci.yml. The Visual Studio generator ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER, so a compiler cache cannot attach to it.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake --preset ci-windows-release -DAETHERCORE_BUILD_EDITOR=ON -DAETHERCORE_BUILD_LAUNCHER=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /DNDEBUG /Zi' '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG:FULL /OPT:REF /OPT:ICF'
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
          SCCACHE_GHA_ENABLED: "true"

      # Release, not RelWithDebInfo: AE_DEV_TOOLING gates the validation layer and the
      # editor's other development-only cost to the debug configurations, so a shipped
      # editor must not be built in one of them.
      - name: Build
        # --parallel: see the note in ci.yml. Without it MSBuild builds one project at a
        # time and the build step dominates the whole run.
        run: cmake --build --preset ci-windows-release --target Editor GameRuntime Launcher EngineTests
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: sccache stats
        run: sccache --show-stats

      # Nothing should be published that has not been tested. The GPU smokes need a
      # display the runner does not have, so this is the unit suite only - the same
      # boundary ci.yml draws.
      - name: Unit tests
        shell: pwsh
        run: ./scripts/Invoke-CTestQualification.ps1 -BuildDir build/ci-windows-release -Config Release -ReportPath logs/release-ctest.json

      - name: Qualification harness regressions
        shell: pwsh
        run: |
          ./scripts/Test-Qualification.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Qualification harness regression failed' }
          python scripts/test_release_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Release identity regression failed' }
          python scripts/check_manual_workflows.py

      - name: Stage the redistributable
        run: cmake --install build/ci-windows-release --component Runtime --prefix "${{ github.workspace }}/staging"

      # A bundled runtime is what lets the editor start on a machine with no .NET at all;
      # DotNetHost points hostfxr at this directory when it exists. The SDK is a separate
      # matter - it is only needed to COMPILE a project's scripts, is far larger, and the
      # editor detects and reports its absence at runtime.
      - name: Bundle the .NET runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          # A separate process because the script calls exit, which would otherwise end
          # this step's shell before the later commands run.
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\dotnet-install.ps1" `
              -Runtime dotnet -Channel 10.0 -InstallDir "${{ github.workspace }}\staging\dotnet" -NoPath
          $runtimes = Get-ChildItem "${{ github.workspace }}\staging\dotnet\shared\Microsoft.NETCore.App" -Directory -ErrorAction SilentlyContinue
          if (-not $runtimes) { throw 'No runtime was staged into staging/dotnet' }
          Write-Host "Bundled runtime: $($runtimes.Name -join ', ')"

      - name: Preserve bundled runtime and Roslyn notices
        shell: pwsh
        run: ./scripts/Add-ManagedPackageNotices.ps1 -PayloadDir staging

      - name: Bind staged bytes to source and retained symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force symbols | Out-Null
          foreach ($name in @('Editor', 'Launcher', 'AetherGame')) {
            # Never flatten managed AetherGame.pdb over the native runtime PDB.
            Copy-Item -LiteralPath "build/ci-windows-release/src/app/$name.pdb" -Destination symbols
          }
          python scripts/Write-ReleaseIdentity.py --payload staging --symbols symbols --build-dir build/ci-windows-release --stage-only --report staging/BUILD_PROVENANCE.json
          if ($LASTEXITCODE -ne 0) { throw 'Staged source/byte/symbol provenance failed' }

      - name: Verify the staged payload inventory
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PayloadDir "${{ github.workspace }}/staging" -RequireBundledRuntime -RequireBuildProvenance

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DPayloadDir=${{ github.workspace }}\staging" `
                  "/DAppVersion=${{ steps.version.outputs.numeric }}" `
                  "/O${{ github.workspace }}\dist" `
                  packaging\AetherCore.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Build the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}\dist" | Out-Null
          Compress-Archive -Path "${{ github.workspace }}\staging\*" `
                           -DestinationPath "${{ github.workspace }}\dist\AetherCore-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Retain symbols and release identity
        shell: pwsh
        run: |
          Compress-Archive -Path symbols/* -DestinationPath dist/AetherCore-symbols.zip
          python scripts/Write-ReleaseIdentity.py --payload staging --artifacts dist --symbols symbols --build-dir build/ci-windows-release --report dist/release-identity.json
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance or matching symbol identity failed' }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-win-x64
          path: dist/*

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-evidence
          path: logs/release-ctest.*
