    far = 1000.0
    focal_length_mm = 50.0
    focus_distance = 18.0
    fov = 60.0
    gradient_angle = 0.0
    main = true
    near = 0.1
    orthographic_height = 10.0
    projection = 'perspective'

        [[entities.camera.gradient_stops]]
