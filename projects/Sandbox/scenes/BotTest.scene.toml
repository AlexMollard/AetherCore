# parented to anything (this scene has no first-person viewpoint - the bot does
# not look at anything, it just reads positions). Framed to keep the full
# 20x20 floor in view from outside the walls. ---
[[entities]]
euler = [ -42.0, 0.0, 0.0 ]
name = 'Overview Camera'
parent = -1
position = [ 0.0, 15.0, 15.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
