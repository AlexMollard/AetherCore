# AetherCore scene - standalone test arena for BotBrain (the AI player).
#
# A small, fully enclosed physics box: four walls (unlike Sandbox.scene.toml's
# three-plus-open-side arena - this scene has no human player to walk in through
# the gap, so closing all four sides keeps an autonomous bot from ever wandering
# off the ground slab into the void), six scattered grabbable props, and one Bot
# entity (a real Character Controller, same component the human Player in
# Sandbox.scene.toml uses) running BotBrain + BotGrabber instead of
# FirstPersonPlayer + PhysicsGun. No PhysicsGun.cs instance is attached anywhere
# in this scene - BotBrain.OnAttach tags the Props group's children "grabbable"
# itself (see its own file comment on why that duplicate-but-idempotent tagging
# is deliberate), so the bot is fully self-contained here.
#
# The Overview Camera is a plain fixed-position `main` camera (not parented to
# the Bot) elevated and angled down over the whole arena, purely so Play mode
# renders something a screenshot can show - the bot itself has no first-person
# camera, since it steers by reading positions directly rather than looking at
# anything.
#
# `node`/`parent_node` are intentionally omitted, same as Sandbox.scene.toml -
# see that file's own comment.
[environment]
ambient = [ 0.14, 0.15, 0.17 ]
sky_horizon = [ 0.42, 0.48, 0.64 ]
sky_void = [ 0.001, 0.002, 0.004 ]
sky_zenith = [ 0.09, 0.16, 0.38 ]
sun_color = [ 1.0, 0.92, 0.82 ]
sun_direction = [ -0.6307061, 0.68326485, 0.36791185 ]
sun_intensity = 4.0

[scene]
features = [ 'meshes_3d', 'lighting_3d', 'physics_3d' ]
kind = '3d'
name = ''
version = 16

# --- index 0: Key Light ---
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Key Light'
parent = -1
position = [ 6.0, 10.0, 6.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.point_light]
    color = [ 1.0, 0.92, 0.82 ]
    flicker = 0.0
    flickerSpeed = 8.0
    intensity = 60.0
    radius = 30.0
    shadow = true
    sourceRadius = 0.1

