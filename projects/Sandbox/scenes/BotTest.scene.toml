# --- index 16: Bot 1 - a real Character Controller (Jolt CharacterVirtual),
# identical tuning to Sandbox.scene.toml's own Player entity. Position is the
# FEET, same convention as Player - y = 0.0 sits on the ground slab's top
# surface (Ground centred at y = -0.5, half_height 0.5). Bot 1 Body (index 17)
# is this entity's visual stand-in, since a Character Controller has no mesh
# of its own (same as Player, which is invisible on purpose - a first-person
# view never needs to see itself; this bot needs to be SEEN, hence the body).
# Three bots share this arena (indices 16, 19, 21) plus one Soak Monitor
# (index 23) - see BotBrain.cs's own file comment on why nothing about this
# script assumes there is only one, and BotSoakMonitor.cs's for how the monitor
# finds all of them via the "bot" tag rather than a fixed list. ---
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Bot 1'
parent = -1
position = [ 0.0, 0.0, -6.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.character_controller]
    gravity_scale = 2.0
    ground_snap_distance = 0.3
    half_height = 0.6
    mass = 80.0
    max_push_force = 600.0
    max_slope_angle = 0.7853982
    radius = 0.3
    step_height = 0.3

    [[entities.scripts]]
    type = 'BotBrain'

# --- index 17: Bot 1 Body - purely visual capsule stand-in (no "capsule"
# primitive exists - see AssetDatabase.cpp's kPrimitiveKinds - so this is a
# cube sized to the character's radius/half_height bounding box instead).
# World-space position, like every child transform in this file (scene
# transforms are world-space, parent scale does not compound) - offset up by
# half its own height above the Bot's feet, same relationship Sandbox.scene.toml's
# Main Camera has to Player via EyeHeight. No physics component: the Character
# Controller's own inner Jolt capsule is the only collider this entity needs;
# a second box collider here would just fight it. ---
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Bot 1 Body'
parent = 16
position = [ 0.0, 0.9, -6.0 ]
scale = [ 0.6, 1.8, 0.6 ]

    [entities.material]
    alpha_blend = false
    alpha_cutoff = 0.5
    alpha_mask = false
    base_color = [ 0.95, 0.55, 0.05, 1.0 ]
    double_sided = false
    emissive = [ 0.1, 0.05, 0.0 ]
    metallic = 0.0
    occlusion = 1.0
    receive_shadows = true
    roughness = 0.5
    vertex_color = false

    [entities.mesh]
    index = 0
    kind = 'primitive'
    path = 'cube'

# --- index 18: Ragdoll Dummy - a bare transform BotBrain.OnAttach converts into a
# physics ragdoll (Ragdoll.Spawn) on Play, using the Human.gltf skeleton copied into
# this project's own assets/models/Human/ purely for its bind pose (see
# BotBrain.SpawnRagdollDummy's own comment - nothing about that asset's rendering or
# animation is used). Standing upright at ground level so the bind pose places its
# feet at y = 0, same convention as Ground's top surface. Deliberately has no
# mesh/physics/light section of its own - Ragdoll.Spawn installs everything the
# pelvis bone needs (rigid body, collider, mesh) and builds ten more bone entities
# alongside it, all tagged "grabbable" the same way as any prop. ---
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Ragdoll Dummy'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

