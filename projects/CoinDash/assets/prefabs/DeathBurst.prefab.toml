# One-shot player death burst. PlayerController.Die() instantiates it at the
# player. A radial spark explosion (root) with falling debris chunks and a soft
# smoke puff (children). Every emitter bursts once and auto-destroys; the root
# has the longest lifetime so the hierarchy teardown never clips a child.
[[entities]]
name = 'Death Burst'
guid = 1
parent = -1
position = [ 0.0, 0.0, 0.0 ]
euler = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.particles]
    texture = 'project://assets/textures/particles/spark.png'
    rate = 0.0
    burst_count = 30
    emit_on_start = true
    emitting = true
    auto_destroy = true
    max_particles = 56
    lifetime_min = 0.35
    lifetime_max = 1.0
    speed_min = 2.5
    speed_max = 7.5
    direction_deg = 90.0
    spread_deg = 360.0
    gravity = [ 0.0, -5.0 ]
    start_size = 0.36
    end_size = 0.0
    start_color = [ 1.0, 0.62, 0.26, 1.0 ]
    end_color = [ 1.0, 0.2, 0.15, 0.0 ]
    blend_mode = 'additive'
    sorting_layer = 20
    order_in_layer = 2

