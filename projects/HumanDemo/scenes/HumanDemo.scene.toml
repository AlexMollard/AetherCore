# AetherCore scene - hand-authored hierarchy (no runtime spawner scripts).
# Entities are placed directly here; the human animates via its skinned component.
[environment]
ambient = [ 0.020000000474974513, 0.02199999988079071, 0.027999999225139618 ]
sky_horizon = [ 0.03999999910593033, 0.05000000074505806, 0.07999999821186066 ]
sky_void = [ 0.0020000000949949026, 0.003000000026077032, 0.006000000052154064 ]
sky_zenith = [ 0.009999999776482582, 0.014999999664723873, 0.029999999329447746 ]
sun_color = [ 0.30000001192092896, 0.3199999928474426, 0.38999998569488525 ]
sun_direction = [ 0.20000000298023224, -0.8999999761581421, 0.30000001192092896 ]
sun_intensity = 1.2000000476837158

[scene]
name = 'HumanDemo'
version = 7

# ── Ground ──────────────────────────────────────────────────────────────────
[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Ground'
parent = -1
position = [ 0.0, -0.5, 0.0 ]
scale = [ 16.0, 1.0, 16.0 ]

    [entities.material]
    alpha_blend = false
    alpha_cutoff = 0.5
    alpha_mask = false
    base_color = [ 0.10000000149011612, 0.10999999940395355, 0.12999999523162842, 1.0 ]
    double_sided = false
    emissive = [ 0.0, 0.0, 0.0 ]
    metallic = 0.0
    occlusion = 1.0
    receive_shadows = true
    roughness = 0.800000011920929
    vertex_color = false

    [entities.mesh]
    index = 0
    kind = 'primitive'
    path = 'cube'

    [entities.physics]
    half_extents = [ 8.0, 0.5, 8.0 ]
    half_height = 0.5
    motion = 'static'
    radius = 0.5
    shape = 'box'

# ── Human (skinned model; root container + one child per primitive) ──────────
# A multi-primitive model is a root transform with one child per submesh, each
# carrying its own mesh index, skin and material (mirrors ModelSpawn). The root
# holds the placement + 0.01 scale (the model is authored in centimetres); the
# two primitive children (body + joints) render relative to it. Both walk (clip 1).
[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Human'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

