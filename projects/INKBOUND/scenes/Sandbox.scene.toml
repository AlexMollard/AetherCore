# AetherCore scene - generated by the debug editor
#
# INKBOUND mechanics sandbox. A vertical shaft (world x 17..24) with side bays, one per
# mechanic, so a feature can be tested in isolation.
#
# The shaft's centre lane (world x 19..22) is clear top to bottom: step off any bay and
# you fall straight to the ground floor, then climb back to a different bay without
# replaying the whole level. Either shaft wall is a ladder of one-way rungs every 3
# units - inside the player's ~3.4-unit jump - at x 17..19 (left) and x 22..24 (right).
#
# Bays alternate sides so each gets ~8 units of headroom, and the rungs sit in the open
# shaft rather than under a bay floor (tuck them under one and there is no standing room
# on them, and the bay above becomes a 5-unit jump - i.e. unreachable).
#
#   y=26  [ SUMMIT: goal ]                                    x 13..19
#   y=21  [ RIGHT BAY: hazard / enemy / checkpoint / spring ]  x 24..36
#   y=16  [ LEFT  BAY: ink gym - floor gap x 11..15 + crystal ]x  5..17
#   y=11  [ RIGHT BAY: dialogue plaza - npc / sign / zone ]    x 24..36
#   y=6   [ LEFT  BAY: one-way platform + coins ]              x  5..17
#   y=1   [ GROUND: spawn + intro sign ]                       x  5..36
[scene]
features = [ 'sprites', 'tilemaps', 'physics_2d', 'meshes_3d', 'lighting_3d', 'navigation', 'physics_3d' ]
kind = '2d'
name = ''
version = 16

