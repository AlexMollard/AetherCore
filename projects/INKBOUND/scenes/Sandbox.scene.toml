# INKBOUND sandbox - a flat ink shelf for testing the horror inkscape mechanics:
# a dialogue trigger zone, an NPC, a readable sign, and an ink (aether) crystal.
[scene]
features = [ 'sprites', 'tilemaps', 'physics_2d', 'meshes_3d', 'lighting_3d', 'navigation', 'physics_3d' ]
kind = '2d'
name = ''
version = 16

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Main Camera'
parent = -1
position = [ 5.0, 3.0, 10.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
    background = 'solid_colour'
    clear_color = [ 0.05, 0.06, 0.1 ]
    far = 1000.0
    fov = 60.0
    gradient_angle = 0.0
    main = true
    near = 0.1
    orthographic_height = 13.0
    projection = 'orthographic'

    [[entities.scripts]]
    type = 'CameraFollow'

        [entities.scripts.properties.BaseY]
        t = 'float'
        v = 3.0

        [entities.scripts.properties.MinX]
        t = 'float'
        v = 6.0

        [entities.scripts.properties.MaxX]
        t = 'float'
        v = 15.0

