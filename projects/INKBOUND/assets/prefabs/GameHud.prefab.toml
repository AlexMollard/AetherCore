# INKBOUND HUD - the single source of truth for every level's UI.
# PlayerController spawns it at runtime (Scene.Instantiate("GameHud")), so all
# levels share one layout; HudController drives the live values.
[[entities]]
name = 'GameHud'
parent = -1

    [entities.ui_canvas]
    scale_mode = 1
    reference = [ 1920.0, 1080.0 ]
    sort_bias = 0

    [entities.ui_rect]
    anchor_min = [ 0.0, 0.0 ]
    anchor_max = [ 1.0, 1.0 ]
    offset_min = [ 0.0, 0.0 ]
    offset_max = [ 0.0, 0.0 ]
    pivot = [ 0.5, 0.5 ]

    [[entities.scripts]]
    type = 'HudController'

    [[entities.scripts]]
    type = 'PauseController'

[[entities]]
name = 'HudCoinIcon'
parent = 0

    [entities.ui_rect]
    anchor_min = [ 0.0, 0.0 ]
    anchor_max = [ 0.0, 0.0 ]
    offset_min = [ 28.0, 24.0 ]
    offset_max = [ 76.0, 72.0 ]
    pivot = [ 0.0, 0.0 ]

    [entities.ui_image]
    color = [ 1.0, 1.0, 1.0, 1.0 ]
    corner_radius = 0.0
    pixel_art = true
    texture = 'project://assets/textures/tex_CoinIcon.png'

[[entities]]
name = 'HudCoinText'
parent = 0

    [entities.ui_rect]
    anchor_min = [ 0.0, 0.0 ]
    anchor_max = [ 0.0, 0.0 ]
    offset_min = [ 92.0, 24.0 ]
    offset_max = [ 600.0, 72.0 ]
    pivot = [ 0.0, 0.0 ]

    [entities.ui_text]
    text = 'x 0'
    font = 'PixelStorm'
    pixel_size = 40.0
    color = [ 1.0, 0.92, 0.35, 1.0 ]
    h_align = 0
    v_align = 1
    wrap = false

[[entities]]
name = 'HudTrialClock'
parent = 0

    [entities.ui_rect]
    anchor_min = [ 0.5, 1.0 ]
    anchor_max = [ 0.5, 1.0 ]
    offset_min = [ -160.0, -64.0 ]
    offset_max = [ 160.0, -16.0 ]
    pivot = [ 0.5, 1.0 ]

    [entities.ui_text]
    text = ''
    font = 'PixelStorm'
    pixel_size = 40.0
    color = [ 0.86, 0.93, 0.96, 1.0 ]
    h_align = 1
    v_align = 1
    wrap = false

[[entities]]
name = 'HudBanner'
parent = 0
disabled = true

    [entities.ui_rect]
    anchor_min = [ 0.5, 0.4 ]
    anchor_max = [ 0.5, 0.4 ]
    offset_min = [ -560.0, -80.0 ]
    offset_max = [ 560.0, 80.0 ]
    pivot = [ 0.5, 0.5 ]

    [entities.ui_text]
