# A talking NPC. Sprite body + a DialogueTrigger in interact mode + the Npc flair script
# (faces the player, idle bob). Drop it in a scene and override DialogueId per instance.
# The DialogueTrigger self-provisions its own sensor box, so no collider is authored here.
[[entities]]
name = 'Npc'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
euler = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.sprite]
    atlas = ''
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 4
    pivot = [ 0.5, 0.5 ]
    pixel_art = true
    pixel_size = [ 16.0, 24.0 ]
    pixel_snap = false
    pixels_per_unit = 16.0
    sorting_layer = 0
    texture = 'project://assets/textures/npc_wraith.png'
    tint = [ 1.0, 1.0, 1.0, 1.0 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [[entities.scripts]]
    type = 'DialogueTrigger'

        [entities.scripts.properties.DialogueId]
        t = 'string'
        v = 'npc_wraith'

        [entities.scripts.properties.RequireInteract]
        t = 'bool'
        v = true

        [entities.scripts.properties.Once]
        t = 'bool'
        v = false

        [entities.scripts.properties.PromptLabel]
        t = 'string'
        v = '> talk'

    [[entities.scripts]]
    type = 'Npc'
