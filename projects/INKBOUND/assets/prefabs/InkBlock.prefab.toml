# Aether-ink platform block. AetherInk instantiates a trail of these as the
# player draws; each is a solid static collider you can stand on, and it fades
# and self-destructs after a few seconds (see InkBlock.cs).
[[entities]]
name = 'InkBlock'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
euler = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.sprite]
    atlas = ''
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 2
    pivot = [ 0.5, 0.5 ]
    pixel_art = true
    pixel_size = [ 16.0, 6.0 ]
    pixel_snap = false
    pixels_per_unit = 16.0
    sorting_layer = 0
    texture = 'project://assets/textures/ink.png'
    tint = [ 1.0, 1.0, 1.0, 1.0 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [entities.collider_2d]
    capsule_height = 1.0
    category_bits = 1
    density = 1.0
    friction = 0.4
    group_index = 0
    is_trigger = false
    mask_bits = 4294967295
    offset = [ 0.0, 0.0 ]
    radius = 0.35
    restitution = 0.0
    shape = 'box'
    size = [ 0.92, 0.34 ]

    [entities.rigid_body_2d]
    allow_sleeping = true
    angular_damping = 0.05
    body_type = 'static'
    continuous_collision = false
    fixed_rotation = true
    gravity_scale = 1.0
    linear_damping = 0.0
    start_awake = true

    [[entities.scripts]]
    type = 'InkBlock'
