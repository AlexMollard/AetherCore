# A slab that sinks while its Channel is held down by a PressurePlate. Kinematic, so it moves
# properly and carries what stands on it. Place it under an overhang, or the player will simply
# draw a bridge over the top. Set Channel to match its plate.
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Gate'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.sprite]
    atlas = ''
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 3
    pivot = [ 0.5, 0.5 ]
    pixel_art = true
    pixel_size = [ 16.0, 48.0 ]
    pixel_snap = false
    pixels_per_unit = 16.0
    sorting_layer = 0
    texture = 'project://assets/textures/gate.png'
    tint = [ 1.0, 1.0, 1.0, 1.0 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [entities.collider_2d]
    capsule_height = 1.0
    category_bits = 1
    density = 1.0
    friction = 0.4
    group_index = 0
    is_trigger = false
    mask_bits = 4294967295
    offset = [ 0.0, 0.0 ]
    points = []
    radius = 0.5
    restitution = 0.0
    shape = 'box'
    size = [ 1.0, 3.0 ]

    [entities.rigid_body_2d]
    allow_sleeping = false
    angular_damping = 0.05
    body_type = 'kinematic'
    continuous_collision = false
    fixed_rotation = true
    gravity_scale = 0.0
    linear_damping = 0.0
    start_awake = true

    [entities.point_light]
    color = [ 0.3, 0.8, 1.0 ]
    flicker = 0.0
    flickerSpeed = 8.0
    intensity = 1.5
    radius = 3.2
    shadow = false

    [[entities.scripts]]
    type = 'Gate'

        [entities.scripts.properties.Channel]
        t = 'string'
        v = 'l1gate'

        [entities.scripts.properties.OpenDrop]
        t = 'float'
        v = 3.2
