# A floating wraith enemy. Drifts and bobs through the air, turning at walls and crossing gaps;
# dispel it with a stomp from above, or it sends you back to the checkpoint (FloatingWraith.cs).
# Kinematic + trigger so it passes through you and is driven purely by velocity.
[[entities]]
name = 'Wraith'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
euler = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.collider_2d]
    capsule_height = 1.0
    category_bits = 1
    density = 1.0
    friction = 0.0
    group_index = 0
    is_trigger = true
    mask_bits = 4294967295
    offset = [ 0.0, 0.0 ]
    radius = 0.5
    restitution = 0.0
    shape = 'box'
    size = [ 0.8, 0.8 ]

    [entities.rigid_body_2d]
    allow_sleeping = false
    angular_damping = 0.05
    body_type = 'kinematic'
    continuous_collision = false
    fixed_rotation = true
    gravity_scale = 0.0
    linear_damping = 0.0
    start_awake = true

    [entities.sprite]
    atlas = 'project://assets/textures/slime/walk32x32.spriteatlas.toml'
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 0
    pivot = [ 0.0, 0.0 ]
    pixel_art = false
    pixel_size = [ 0.0, 0.0 ]
    pixel_snap = false
    pixels_per_unit = 16.0
    sorting_layer = 0
    texture = 'project://assets/textures/slime/walk32x32.png'
    tint = [ 0.55, 0.38, 0.85, 0.82 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [entities.sprite_animator]
    animation = 'project://assets/animations/enemy_walk.spriteanim.toml'
    autoplay = true
    loop_mode = 'loop'
    speed = 1.0
    start_frame = 0
    use_asset_loop_mode = true

    [[entities.scripts]]
    type = 'FloatingWraith'
