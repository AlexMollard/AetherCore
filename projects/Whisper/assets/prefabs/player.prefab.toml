# Whisper test player: run/jump platformer body borrowed from INKBOUND
# (PlayerController.cs, pruned of checkpoints/ink/death-melt), plus the three
# networking components every replicated player needs.
#
# `network_identity` is deliberately an empty table: netId/owner/spawnPrefab are
# runtime state the host assigns at Net.Spawn, and authoring them here would fight
# that. The table's PRESENCE is the whole point - it is the "this entity is
# replicated" mark.
[[entities]]
name = 'Player'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
euler = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.collider_2d]
    capsule_height = 1.0
    category_bits = 1
    density = 1.0
    friction = 0.0
    group_index = 0
    is_trigger = false
    mask_bits = 4294967295
    offset = [ 0.0, 0.0 ]
    points = []
    radius = 0.5
    restitution = 0.0
    shape = 'box'
    size = [ 1.0, 1.3 ]

    [entities.net_player]
    display_name = ''

    [entities.network_identity]

    [entities.network_transform]
    correction_rate = 12.0
    interpolation_delay = 0.10000000000000001
    snap_distance = 4.0

    [entities.rigid_body_2d]
    allow_sleeping = true
    angular_damping = 0.05
    body_type = 'dynamic'
    continuous_collision = true
    fixed_rotation = true
    gravity_scale = 4.0
    linear_damping = 0.0
    start_awake = true

    [entities.sprite]
    atlas = 'project://assets/textures/player/idle32x32.spriteatlas.toml'
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 0
    pivot = [ 0.0, 0.0 ]
    pixel_art = true
    pixel_size = [ 0.0, 0.0 ]
    pixel_snap = true
    pixels_per_unit = 16.0
    sorting_layer = 1
    texture = 'project://assets/textures/player/idle32x32.png'
    tint = [ 1.0, 1.0, 1.0, 1.0 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [entities.sprite_animator]
    animation = 'project://assets/animations/player_idle.spriteanim.toml'
    autoplay = true
    loop_mode = 'loop'
    speed = 1.0
    start_frame = 0
    use_asset_loop_mode = true

    [[entities.scripts]]
    type = 'PlayerController'
