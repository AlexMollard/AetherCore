# ── HUD ─────────────────────────────────────────────────────────────────────────
# One canvas for the whole arena, authored rather than left to whichever script
# happened to run first. Every script-built HUD element (the chat, the roster, the
# name tags) attaches to the first canvas it finds, so this is the one they land on.
#
# constant_pixel deliberately, NOT scale_with_reference: the name tags are placed from
# Camera.WorldToScreen, which reports real screen pixels, and a canvas that rescaled
# them would slide every tag off its character on any window that is not exactly the
# reference size.
#
# The pause menu hangs off it as a DISABLED subtree rather than being a canvas of its
# own, for the same reason: a disabled canvas would take the rest of the HUD down with
# it, since that is the canvas everything else attached to.
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'HudCanvas'
node = 7200000000000000001
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.ui_canvas]
    reference = [ 1920.0, 1080.0 ]
    scale_mode = 'constant_pixel'
    sort_bias = 0

    [entities.ui_rect]
    anchor_max = [ 1.0, 1.0 ]
    anchor_min = [ 0.0, 0.0 ]
    offset_max = [ 0.0, 0.0 ]
    offset_min = [ 0.0, 0.0 ]
