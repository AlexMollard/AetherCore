# Lighting feature smoke test.
#
# Built to answer one question per feature: does it do anything at all? GTAO spent an
# unknown length of time effectively dead - its search radius was clamped to two pixels, so
# it drew a one-pixel line at depth edges and nothing else - and nobody noticed, because a
# subtle effect that does nothing looks a lot like a subtle effect.
#
# So the scene is arranged to make each feature's absence obvious rather than plausible:
#   - a STRONG sun and near-zero ambient, because contact shadows and cascade shadows
#     modulate direct light only; under the ambient-dominated setup used for AO they would
#     be invisible whether they worked or not
#   - boxes and spheres resting flush on the floor, giving contact shadows their case
#   - a GLOSSY floor (roughness 0.12) so screen-space reflections have something to reflect
#   - a low sun angle, so shadows are long and the cascades are actually exercised
[environment]
ambient = [ 0.04, 0.05, 0.07 ]
sky_horizon = [ 0.45, 0.5, 0.6 ]
sky_void = [ 0.08, 0.09, 0.12 ]
sky_zenith = [ 0.2, 0.35, 0.65 ]
sun_color = [ 1.0, 0.95, 0.85 ]
sun_direction = [ 0.55, 0.42, 0.72 ]
sun_intensity = 3.5

