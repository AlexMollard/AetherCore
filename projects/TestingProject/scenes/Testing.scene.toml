position = [ -2.409837484359741, 4.252716541290283, -1.710627794265747 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.point_light]
    color = [ 0.0, 0.4690268039703369, 1.0 ]
    intensity = 20.0
    radius = 15.0
    shadow = true

[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Platform'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 14.0, 1.0, 14.0 ]

    [entities.material]
    albedo = 'project://assets/materials/MyPBRFolder/Grass004_1K-JPG_Color.jpg'
    alpha_blend = false
    alpha_cutoff = 0.5
    alpha_mask = false
    base_color = [ 0.12389379739761353, 0.12389379739761353, 0.12389379739761353, 1.0 ]
    double_sided = false
    emissive = [ 0.0, 0.0, 0.0 ]
    metallic = 0.0
    metallic_roughness = 'project://assets/materials/MyPBRFolder/Grass004_1K-JPG_Roughness.jpg'
    normal = 'project://assets/materials/MyPBRFolder/Grass004_1K-JPG_NormalGL.jpg'
    occlusion = 1.0
    occlusion_tex = 'project://assets/materials/MyPBRFolder/Grass004_1K-JPG_AmbientOcclusion.jpg'
    roughness = 0.6000000238418579
    vertex_color = false

    [entities.mesh]
    index = 0
    kind = 'primitive'
    path = 'cube'

    [entities.physics]
    half_extents = [ 7.0, 0.5, 7.0 ]
    half_height = 0.5
    motion = 'static'
    radius = 0.5
    shape = 'box'

[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Player'
parent = -1
position = [ 0.0, 1.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.material]
    alpha_blend = false
    alpha_cutoff = 0.5
    alpha_mask = false
    base_color = [ 0.95, 0.55, 0.2, 1.0 ]
    double_sided = false
    emissive = [ 0.0, 0.0, 0.0 ]
    metallic = 0.0
    occlusion = 1.0
    roughness = 0.5
