# AetherCore scene - "Orb Collector" demo.
# Almost everything gameplay is script-driven: GameManager builds the HUD, spawns
# and collects orbs, runs the timer and debug draw; Player drives movement and the
# camera. The scene only authors the arena, lights, the player rig and the camera.
[environment]
ambient = [ 0.21470779180526733, 0.13195961713790894, 0.07854779064655304 ]
sky_horizon = [ 0.7606372833251953, 0.37127262353897095, 0.1577703207731247 ]
sky_void = [ 0.0004472656291909516, 0.0008515624795109034, 0.0018945311894640326 ]
sky_zenith = [ 0.17554670572280884, 0.11731411516666412, 0.27372387051582336 ]
sun_color = [ 1.2208551168441772, 0.6075463891029358, 0.31718823313713074 ]
sun_direction = [ 0.9889363646507263, 0.0, 0.14834046363830566 ]
sun_intensity = 0.654101550579071

[scene]
name = ''
version = 8

[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Point Light'
parent = -1
position = [ 2.88397479057312, 4.2526631355285645, 4.279628276824951 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.point_light]
    color = [ 1.0, 0.0, 0.0 ]
    intensity = 20.0
    radius = 15.0
    shadow = true

[[entities]]
euler = [ -0.0, 0.0, 0.0 ]
name = 'Point Light'
