    [entities.mesh]
    index = 0
    kind = 'primitive'
    path = 'cube'

    [entities.physics]
    half_extents = [ 0.5, 0.5, 0.5 ]
    half_height = 0.5
    motion = 'dynamic'
    radius = 0.5
    shape = 'box'

    [[entities.scripts]]
    type = 'Player'

# Authored third-person main camera. Player resolves it at runtime via
# Camera.Main and drives the follow target each tick.
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Camera'
parent = -1
position = [ 0.0, 7.1, 12.65 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
    far = 1000.0
    fov = 60.0
    main = true
    near = 0.1

    [entities.orbit_camera]
    distance = 13.46
    pitch = 20.0
    target = [ 0.0, 2.5, 0.0 ]
    yaw = 0.0

# Script-only game brain: no mesh, just the GameManager behaviour.
[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'GameManager'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [[entities.scripts]]
    type = 'GameManager'
