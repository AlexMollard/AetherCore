euler = [ 0.0, 0.0, 0.0 ]
mesh_renderer = true
name = 'Furnace_M_0.05'
node = 910000000
parent = -1
position = [ -7.800000000000001, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.material]
    alpha_blend = false
    alpha_cutoff = 0.5
    alpha_mask = false
    base_color = [ 1.0, 1.0, 1.0, 1.0 ]
    double_sided = false
    emissive = [ 0.0, 0.0, 0.0 ]
    metallic = 1.0
    occlusion = 1.0
    receive_shadows = true
    roughness = 0.05
    vertex_color = false

