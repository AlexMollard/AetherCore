# White furnace test.
#
# A uniform environment and nothing else: no sun, no ambient term, no fog, no
# ground. Under a uniform environment of radiance E, a white metal must render
# exactly E at EVERY roughness - it reflects all the light that reaches it and
# there is nowhere else for that light to go. Any darkening as roughness rises is
# energy the BRDF lost rather than a material property.
#
# The sky gradient is flat here on purpose (horizon = zenith = void), so the
# environment really is uniform and the comparison is sphere against background.
[environment]
ambient = [ 0.0, 0.0, 0.0 ]
sky_horizon = [ 0.5, 0.5, 0.5 ]
sky_void = [ 0.5, 0.5, 0.5 ]
sky_zenith = [ 0.5, 0.5, 0.5 ]
sun_color = [ 1.0, 1.0, 1.0 ]
sun_direction = [ 0.0, 1.0, 0.0 ]
sun_intensity = 0.0

[scene]
features = [ 'meshes_3d', 'lighting_3d' ]
kind = '3d'
name = ''
version = 16

[[assets]]
builtin = true
id = '0522571ed8cb4104'
path = 'sphere'
type = 'mesh'

