# Antialiasing test.
#
# Built to give FXAA the clearest case it can possibly have, because two earlier attempts to
# measure it were confounded:
#   - a smooth-shaded scene had edges too low in contrast for FXAA to key on, so doing
#     nothing there was arguably correct
#   - a depth-of-field scene pre-blurred the very silhouettes under test, and its sky sat at
#     maximum circle of confusion
#
# So: depth of field OFF, no fog, near-black geometry against a bright sky - the largest luma
# step available - and every box rotated off-axis. Diagonals matter because a vertical or
# horizontal silhouette lands on the pixel grid exactly and barely aliases; it is the shallow
# diagonal that staircases, and that is what an edge filter exists to fix.
#
# The measurement is the count of INTERMEDIATE pixels along a silhouette: values between the
# dark object and the bright sky. Antialiasing works by creating those, so the count going up
# is the effect itself rather than a proxy for it.
[environment]
ambient = [ 0.02, 0.02, 0.03 ]
sky_horizon = [ 0.85, 0.90, 1.0 ]
sky_void = [ 0.8, 0.85, 0.95 ]
sky_zenith = [ 0.75, 0.85, 1.0 ]
sun_color = [ 1.0, 1.0, 1.0 ]
sun_direction = [ 0.0, 1.0, 0.2 ]
sun_intensity = 0.4

