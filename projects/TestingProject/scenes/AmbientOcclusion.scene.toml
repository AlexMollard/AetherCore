# Ambient occlusion test.
#
# GTAO only has anything to do where geometry hides the sky from itself: inside
# corners, along creases, and at the contact line where one surface meets another.
# The 3D testbed is the opposite of that - isolated convex spheres floating over a
# flat backdrop, where the correct amount of occlusion really is close to none - so
# measuring AO there says nothing about whether it works.
#
# This scene is built to give it real work AND a control:
#   - a back wall and a side wall meeting in an inside corner (strongest signal)
#   - boxes sitting flush on the ground, so each has a hard contact crease
#   - a box parked one hand's width from the wall, forming a narrow slot
#   - open ground and open wall well away from anything, which must stay unoccluded
#
# Ambient is deliberately the dominant light and the sun is weak, because AO scales
# ambient only. With a strong sun the direct term washes out exactly the term under test.
[environment]
ambient = [ 0.55, 0.58, 0.62 ]
sky_horizon = [ 0.55, 0.58, 0.62 ]
sky_void = [ 0.5, 0.52, 0.56 ]
sky_zenith = [ 0.55, 0.58, 0.62 ]
sun_color = [ 1.0, 0.98, 0.94 ]
sun_direction = [ 0.3, 0.9, 0.35 ]
sun_intensity = 0.6

[scene]
