# Near-field depth of field test.
#
# A lens spreads whatever sits in FRONT of the focus plane over its background: the
# near object's own outline dissolves, because nothing is occluding it. That is the
# one part of defocus a gather cannot express with a single pool of samples - a sharp
# background pixel asked only about its OWN circle of confusion answers "I am in
# focus" and keeps its sharp value, so the foreground stops dead at its silhouette.
#
# The scene is built to make that failure impossible to miss: one bright sphere at
# 3 m against a wall of dark spheres at 25 m, with the lens focused on the wall. At
# f/1.4 and 85 mm the near sphere is far past the blur ceiling, so its edge should be
# a wide soft gradient over sharp background detail - not a crisp circle.
[environment]
ambient = [ 0.05, 0.06, 0.08 ]
sky_horizon = [ 0.35, 0.42, 0.55 ]
sky_void = [ 0.1, 0.12, 0.16 ]
sky_zenith = [ 0.15, 0.25, 0.5 ]
sun_color = [ 1.0, 0.96, 0.9 ]
sun_direction = [ -0.4, 0.75, 0.5 ]
sun_intensity = 3.0

[scene]
features = [ 'meshes_3d', 'lighting_3d' ]
kind = '3d'
name = ''
version = 16

[[assets]]
builtin = true
id = '0522571ed8cb4104'
path = 'sphere'
type = 'mesh'

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Main Camera'
node = 920000000
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
    aperture = 1.4
    background = 'sky_gradient'
    clear_color = [ 0.1, 0.1, 0.12 ]
    depth_of_field = true
    far = 1000.0
    focal_length_mm = 85.0
    focus_distance = 25.0
    fov = 60.0
    gradient_angle = 0.0
    main = true
    near = 0.1
    orthographic_height = 10.0
    projection = 'perspective'

