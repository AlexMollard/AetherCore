# Physics2D exit-gate reference: top-down collision sandbox. WASD to move.
[scene]
kind = '2d'
name = 'TopDown2D'
version = 14
features = [ 'sprites', 'physics_2d' ]

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Main Camera'
parent = -1
position = [ 0.0, 0.0, 10.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
    main = true
    near = 0.1
    far = 1000.0
    orthographic_height = 14.0
    projection = 'orthographic'
    use_sky_gradient = false
    clear_color = [ 0.09, 0.11, 0.10 ]

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Arena North'
parent = -1
position = [ 0.0, 6.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.rigid_body_2d]
    body_type = 'static'

    [entities.collider_2d]
    shape = 'box'
    size = [ 20.0, 1.0 ]

