# N. Sanity Beach, playable. The level itself (scenery, collision, crates, wumpa, Crash's spawn)
# is assembled at play time by TwinsanityLevel from tw-extract's gitignored
# assets/levels/Earth/Hub/beach.level.json, so nothing ISO-derived lives in this file.
[environment]
# Two lighting systems, as in the original.
# 1. Prelit scenery (baked_lighting materials) shows its PS2 vertex colour as is; real-time
#    shadows pull it down to `ambient`, the colour the level's own bake gives fully shaded
#    ground: (62, 61, 124) in GS units (0x80 = 1.0), i.e. (byte/128)^2.2 below. Measured from
#    beach.gltf COLOR_0, upward-facing opaque scenery (logs/lighting-pass2).
# 2. Crash and other models without a bake are lit at runtime by the beach chunk's own light
#    records (beach.sm2 SceneryData, logs/lighting-pass2/lights-dump.ps1): ambient grey 1.5,
#    directional 0 = (3.0, 2.37, 0) towards (0.3816, 0.8192, 0.4281) game space, directional 1 =
#    (1.22, 1.33, 2.5) horizontal fill. Their scale k = 0.29 is measured off the rig: Crash's back
#    at the spawn (lit by ambient alone) renders (128, 46, 0) in the original.
#    Engine PBR ambient = `ambient` + sky, so the sky carries k*1.5 - ambient per channel.
ambient = [ 0.203, 0.196, 0.933 ]
# ponytail: directional 1 (the blue fill) has no engine light; its blue is approximated by the
# bake shade's blue in `ambient` (0.93 vs k*(1.5 + 2.5*N.L)), so Crash's shade side reads a
# little bluer than the original where the fill does not face him. Upgrade: a second
# directional light in the renderer.
sky_horizon = [ 0.232, 0.239, 0.0 ]
sky_void = [ 0.232, 0.239, 0.0 ]
sky_zenith = [ 0.232, 0.239, 0.0 ]
# pi * k * (3.0, 2.37, 0) = (2.73, 2.16, 0), split into colour and intensity.
sun_color = [ 1.0, 0.792, 0.0 ]
# Points TOWARDS the sun: directional 0 above, engine x = -game x.
sun_direction = [ -0.3816, 0.8192, 0.4281 ]
sun_intensity = 2.73
# 3. PS2 object lighting (object_lit materials): the beach chunk's own object lights
# (beach.sm2 SceneryData, logs/wumpa/lights-dump), at the same k = 0.29 the rig calibration
# above measured: ambient 0.29*1.5; directional 0 = 0.29*5.3735*(0.5583, 0.4417, 0) towards
# (0.3816, 0.8192, 0.4281) game space; directional 1 = 0.29*5.047*(0.2412, 0.2634, 0.4953)
# horizontal fill towards (-0.6518, 0, -0.7584) game space. Measured against rig wumpa
# close-ups (logs/wumpa/).
object_ambient = [ 0.435, 0.435, 0.435 ]
object_light0_direction = [ -0.3816, 0.8192, 0.4281 ]
object_light0_color = [ 0.87, 0.688, 0.0 ]
object_light1_direction = [ 0.6518, 0.0, -0.7584 ]
object_light1_color = [ 0.353, 0.385, 0.724 ]

[scene]
name = 'Beach'
version = 16

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Level'
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [[entities.scripts]]
    type = 'TwinsanityLevel'

# Placed at the beach's act_CRASH instance; TwinsanityLevel moves him to the extracted spawn on
# the first frame anyway. The capsule is Crash-sized (his bind pose stands 1.95 units tall) and
# gravity is raised so a 10 m/s jump peaks at about two units, close to the game's arc.
[[entities]]
euler = [ 0.0, 224.82, 0.0 ]
name = 'Crash'
parent = -1
position = [ -6.33, 0.2, -39.6 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.character_controller]
    gravity_scale = 2.5
    ground_snap_distance = 0.35
    half_height = 0.5
    mass = 80.0
    max_push_force = 500.0
    max_slope_angle = 0.8726646
    radius = 0.4
    step_height = 0.35

    [[entities.scripts]]
    type = 'CrashPlayer'
