# AetherCore project file.

[app]
startupscene = "Workbench"

[editor]
flavor = "twinsanity"

[graphics]
asynccompute = true
autoexposure = false
bloomstrength = 0.00
fxaa = false
# -0.5 gave the best detail-per-contrast on rig-matched grass frames (logs/lighting-pass3:
# p3e-b0/-0.5/-1 vs orig-grass). The PS2 picked mips from a fixed per-draw LOD rather than
# screen derivatives, so a small negative bias approximates it; ponytail: -0.5 is the best of
# three measured values, not a fit to the PS2's actual LOD formula.
mipLodBias = -0.5
gtao = false
tonemap = "Linear"
vsync = true

[paths]
assets = "assets"
prefabs = "assets/prefabs"
scenes = "scenes"
scripts = "scripts"

[project]
name = "Twinsanity"
version = 1

[publish]
buildscripts = true
cleanoutput = true
openafter = true
outputroot = "D:\\AetherCore\\projects\\Twinsanity\\Builds"
platformname = "Windows"
productname = "Twinsanity"
synceditorpak = true
usepackagetemplate = true
verifyoutput = true

[window]
height = 1440
width = 2560
