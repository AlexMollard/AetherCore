# Not a model pack - an icon FONT pack (plus PNG spritesheets this importer does not use).
# Every control family ships its own "<Family>/Fonts/<name>.ttf" with a
# "<name>_map.txt" glyph-name -> U+E0xx codepoint reference; ImportFont (KenneyImport.hpp)
# extracts a specific family's .ttf directly by zip member path rather than listing this
# field, so it is left empty.
modelDir = ""
license = "CC0 1.0 Universal"
licenseUrl = "https://creativecommons.org/publicdomain/zero/1.0/"
author = "Kenney (www.kenney.nl)"

