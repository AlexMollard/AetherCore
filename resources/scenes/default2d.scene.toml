# AetherCore scene - blank 2D project template
#
# Ships with one thing you can actually run: a Player square with scripts/Player.cs already
# attached, so a brand-new project answers WASD the first time you press Play.
#
# It used to contain only the camera, with Player.cs sitting in the project attached to
# nothing. That meant a new project opened on an empty grid, Play did visibly nothing, and
# the starter script explained how to attach itself in a comment nobody had a reason to open.
# It also made the launcher thumbnail a black rectangle, because the preview is a faithful
# photograph of an empty scene.
#
# The Main Camera is a CHILD of the Player, which is the whole camera-follow system: scene
# transforms are world-space and ecs::SetWorldTransform propagates a parent's delta to its
# subtree, so moving the Player carries the camera with it. No follow script, no smoothing,
# no code at all. Without it the Player walked off the edge of the screen a second after the
# first key press and never came back.
[scene]
features = [ 'sprites', 'tilemaps', 'physics_2d' ]
kind = '2d'
name = ''
version = 16

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Player'
node = 4416320991174266881
parent = -1
position = [ 0.0, 0.0, 0.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.sprite]
    atlas = ''
    blend_mode = 'alpha'
    flip_x = false
    flip_y = false
    order_in_layer = 0
    pivot = [ 0.5, 0.5 ]
    pixel_art = false
    pixel_size = [ 16.0, 16.0 ]
    pixel_snap = false
    pixels_per_unit = 16.0
    sorting_layer = 0
    texture = ''
    tint = [ 0.95, 0.55, 0.15, 1.0 ]
    uv_rect = [ 0.0, 0.0, 1.0, 1.0 ]
    visible = true

    [[entities.scripts]]
    type = 'Player'

[[entities]]
euler = [ 0.0, 0.0, 0.0 ]
name = 'Main Camera'
node = -6121002470579363918
parent = 0
parent_node = 4416320991174266881
position = [ 0.0, 0.0, 10.0 ]
scale = [ 1.0, 1.0, 1.0 ]

    [entities.camera]
    aperture = 5.6
    background = 'solid_colour'
    clear_color = [ 0.1, 0.1, 0.12 ]
    depth_of_field = false
    far = 1000.0
    focal_length_mm = 50.0
    focus_distance = 10.0
    fov = 60.0
    gradient_angle = 0.0
    main = true
    near = 0.1
    orthographic_height = 10.0
    projection = 'orthographic'

        [[entities.camera.gradient_stops]]
        colour = [ 0.05, 0.06, 0.1 ]
        position = 0.0

        [[entities.camera.gradient_stops]]
        colour = [ 0.02, 0.02, 0.03 ]
        position = 1.0
