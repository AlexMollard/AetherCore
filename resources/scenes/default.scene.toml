# AetherCore scene - default project template
#
# Ships with two things you can actually run. Press Play and the orange Player answers
# WASD, because scripts/Player.cs is already attached to it; the Crate drops onto the
# ground, because it is a dynamic body starting above it.
#
# The 2D template was given a scripted Player and the 3D one was not, which left a new 3D
# project in exactly the state that template's comment describes: Player.cs sat in the
# project attached to nothing, Play did visibly nothing, and the starter script explained
# how to attach itself in a comment nobody had a reason to open.
#
# The Player carries a Character Controller, not a Rigid Body/Collider: a Jolt
# CharacterVirtual, driven by scripts/Player.cs through CharacterController.Move every
# frame rather than by writing Self.Position directly. A raw transform write lands after
# physics has already finished its step for the frame (physics runs before scripts), so it
# teleports the body into whatever is standing there; the controller instead moves through
# the same collision sweep everything else in the scene is subject to, so it stops at a
# wall or a crate instead of sinking into it. Its own position tracks its FEET, not its
# centre, which is why the mesh lives one level down on 'Player Visual' rather than
# directly on 'Player' - offset up by half the controller's total height so it renders
# standing on the ground instead of sunk into it up to its waist.
#
# There is also a Main Camera, which this template did without for a long time. Without one
# the editor opens on the engine's implicit default pose rather than on the scene, and
# publishing warns that the startup scene has no main camera.
#
# The Main Camera is a CHILD of the Player, which is the whole camera-follow system: scene
# transforms are world-space and ecs::SetWorldTransform propagates a parent's delta to its
# subtree, so moving the Player carries the camera with it. No follow script, no smoothing,
# no code at all. Without it the Player walked off the edge of the screen a second after the
# first key press and never came back.

# Re-saving this from the editor must not rewrite it - see the round-trip test in
# tests/scene/SceneRoundTripTests.cpp - so it is written exactly as the serializer emits it.
