# AetherCore scene - manual fixture for the UiRenderer/$UiOverlay wiring
# (Task 2.3). A full-screen canvas with three distinctly-anchored panels so
# UI rendering + anchor resolution can be eyeballed: a fixed-size top-left
# corner panel, a fixed-size centered panel, and a fixed-size top-right
# corner panel. Anchor (0,0) is top-left, (1,1) is bottom-right (screen-space,
# y increases downward - see ui_shapes.slang's sp.y/screenSize.y NDC mapping).

[scene]
name = "UITest"
version = 6

[[entities]]
name = "Canvas"
parent = -1

[entities.ui_canvas]
scale_mode = 0

[entities.ui_rect]
anchor_min = [0.0, 0.0]
anchor_max = [1.0, 1.0]
offset_min = [0.0, 0.0]
offset_max = [0.0, 0.0]

[[entities]]
name = "CornerPanel"
parent = 0

[entities.ui_rect]
anchor_min = [0.0, 0.0]
anchor_max = [0.0, 0.0]
offset_min = [20.0, 20.0]
offset_max = [220.0, 120.0]

[entities.ui_image]
color = [0.9, 0.2, 0.2, 1.0]
corner_radius = 12.0

[[entities]]
name = "CenterPanel"
parent = 0

[entities.ui_rect]
anchor_min = [0.5, 0.5]
anchor_max = [0.5, 0.5]
offset_min = [-100.0, -60.0]
offset_max = [100.0, 60.0]

[entities.ui_image]
color = [0.2, 0.5, 0.9, 0.85]

[[entities]]
name = "TopRightBadge"
parent = 0

[entities.ui_rect]
anchor_min = [1.0, 0.0]
anchor_max = [1.0, 0.0]
offset_min = [-160.0, 20.0]
offset_max = [-20.0, 90.0]

[entities.ui_image]
color = [0.2, 0.85, 0.35, 1.0]
corner_radius = 8.0
