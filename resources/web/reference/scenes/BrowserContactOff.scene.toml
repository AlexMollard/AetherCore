# Task4 material qualification. Capture tick10 at fixed dt1/60 and exposure1.
# The independent controls change only the field stated in each fixture.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.1, 0.1, 0.1]
sun_direction = [0.6, 0.0, 0.8]
sun_intensity = 1.5
sky_horizon = [0.08, 0.12, 0.2]
sky_zenith = [0.04, 0.08, 0.16]
sky_void = [0.02, 0.025, 0.04]
object_ambient = [0.35, 0.35, 0.35]
object_light0_direction = [0.0, 1.0, 0.0]
object_light0_color = [0.5, 0.4, 0.3]
object_light1_direction = [1.0, 0.0, 0.0]
object_light1_color = [0.1, 0.15, 0.2]

[[entities]]
name = 'Fixed material camera'
position = [0, 0, 0]
euler = [0, 0, 0]
[entities.camera]
main = true
projection = 'orthographic'
orthographic_height = 4.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.02, 0.025, 0.04]

[[entities]]
name = 'Contact receiver'
mesh_renderer = true
mesh_renderer_cast_shadows = false
position = [0, 0, -4]
euler = [0, 0, 0]
scale = [7, 7, 1]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.6, 0.6, 0.6, 1.0]
roughness = 1.0
receive_shadows = false

[[entities]]
name = 'Depth-only contact caster'
mesh_renderer = true
mesh_renderer_cast_shadows = false
position = [0, 0, -3.8]
euler = [0, 0, 0]
scale = [0.6, 0.8, 1]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.1, 0.1, 0.1, 1.0]
roughness = 1.0
receive_shadows = false

[[entities]]
name = 'Corner caster keeps native cascade targets active'
mesh_renderer = true
mesh_renderer_cast_shadows = true
position = [1.7, 1.7, -3.4]
euler = [0, 0, 0]
scale = [0.2, 0.2, 1]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.1, 0.1, 0.1, 1.0]
roughness = 1.0
receive_shadows = false

