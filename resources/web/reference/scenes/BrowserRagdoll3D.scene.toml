# Task5 3D gameplay parity: Ragdoll3DProbe builds a ragdoll on the host entity from the Human
# skeleton and the bone bodies collapse onto the floor. Every bone's world transform is compared.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d', 'physics_3d']

[[entities]]
name = 'Floor'
mesh_renderer = true
position = [0, -0.5, 0]
scale = [30, 1, 30]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'static'
half_extents = [15, 0.5, 15]
friction = 0.6

[[entities]]
name = 'Ragdoll host'
position = [0, 1.2, 0]
[[entities.scripts]]
type = 'Ragdoll3DProbe'

[[entities]]
name = 'Camera'
position = [0, 2, 6]
euler = [-8, 0, 0]
[entities.camera]
main = true
projection = 'perspective'
fov = 60.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.02, 0.025, 0.04]
