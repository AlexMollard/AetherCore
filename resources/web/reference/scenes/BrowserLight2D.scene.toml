# Fixed camera/radiance qualification; effects disabled.
[scene]
version = 16
kind = '2d'
features = ['sprites', 'tilemaps']

[[entities]]
name = 'Fixed camera'
position = [0.0, 0.0, 10.0]
[entities.camera]
main = true
projection = 'orthographic'
orthographic_height = 8.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.0, 0.0, 0.0]

[[entities]]
name = 'White receiver'
position = [0.0, 0.0, -3.0]
[entities.sprite]
tint = [1.0, 1.0, 1.0, 1.0]
pixel_size = [800.0, 800.0]
pixels_per_unit = 100.0

[[entities]]
name = 'Authored ambient'
[entities.light_2d_settings]
ambient_color = [0.02, 0.02, 0.02]
ambientIntensity = 1.0
shadowStrength = 0.94
shadowSoftness = 0.0

[[entities]]
name = 'Shadow lamp'
position = [-2.0, 0.0, 0.0]
[entities.point_light]
color = [1.0, 1.0, 1.0]
intensity = 1.0
radius = 8.0
shadow = true

[[entities]]
name = 'Artwork alpha occluder'
position = [-1.0, -1.0, 0.0]
[entities.tile_map]
tilemap = 'project://assets/browser/shadow.tilemap'
