# Task5 3D gameplay parity: script raycasts against a static floor, wall, sphere, a 45-degree
# rotated box and a falling dynamic box. Raycast3DProbe publishes distance, point, normal and
# whether the expected entity was hit.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d', 'physics_3d']

[[entities]]
name = 'Floor'
mesh_renderer = true
position = [0, -0.5, 0]
scale = [30, 1, 30]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'static'
half_extents = [15, 0.5, 15]

[[entities]]
name = 'Wall'
mesh_renderer = true
position = [5, 1, 0]
scale = [1, 2, 6]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'static'
half_extents = [0.5, 1, 3]

[[entities]]
name = 'Ball'
mesh_renderer = true
position = [-5, 1, 0]
[entities.mesh]
kind = 'primitive'
path = 'sphere'
[entities.physics]
shape = 'sphere'
motion = 'static'
radius = 1.0

[[entities]]
name = 'Diamond'
mesh_renderer = true
position = [0, 1, -6]
euler = [0, 45, 0]
scale = [2, 2, 2]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'static'
half_extents = [1, 1, 1]

[[entities]]
name = 'Dropper'
mesh_renderer = true
position = [8, 3, 0]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'dynamic'
half_extents = [0.5, 0.5, 0.5]
mass = 10.0

[[entities]]
name = 'Controller'
position = [0, 0, 0]
[[entities.scripts]]
type = 'Raycast3DProbe'

[[entities]]
name = 'Camera'
position = [0, 6, 16]
euler = [-18, 0, 0]
[entities.camera]
main = true
projection = 'perspective'
fov = 60.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.02, 0.025, 0.04]
