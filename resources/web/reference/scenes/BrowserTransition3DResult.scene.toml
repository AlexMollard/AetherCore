# Destination of BrowserTransition3D: a different 3D scene with a falling sphere and a probe
# that reads back the save written before the transition.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d', 'physics_3d']

[[entities]]
name = 'Platform'
mesh_renderer = true
position = [0, -0.25, 0]
scale = [10, 0.5, 10]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.physics]
shape = 'box'
motion = 'static'
half_extents = [5, 0.25, 5]

[[entities]]
name = 'Arrival'
mesh_renderer = true
position = [1, 3, 0]
[entities.mesh]
kind = 'primitive'
path = 'sphere'
[entities.physics]
shape = 'sphere'
motion = 'dynamic'
radius = 0.5
mass = 5.0
restitution = 0.4
[[entities.scripts]]
type = 'TransitionResult3DProbe'

[[entities]]
name = 'Camera'
position = [0, 3, 10]
euler = [-10, 0, 0]
[entities.camera]
main = true
projection = 'perspective'
fov = 60.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.02, 0.025, 0.04]
