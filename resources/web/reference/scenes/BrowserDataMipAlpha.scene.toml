# Alpha is unused by the metallic/roughness shader; data RGB matches the control.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.3, 0.3, 0.3]
sun_direction = [0.0, 0.0, 1.0]
sun_intensity = 1.0
sky_horizon = [0.0, 0.0, 0.0]
sky_zenith = [0.0, 0.0, 0.0]
sky_void = [0.0, 0.0, 0.0]

[[entities]]
name = 'Fixed camera'
position = [0.0, 0.0, 0.0]
[entities.camera]
main = true
projection = 'orthographic'
orthographic_height = 8.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.0, 0.0, 0.0]

[[entities]]
name = 'Minified metallic roughness'
mesh_renderer = true
position = [0.0, 0.0, -2.0]
scale = [5.0, 4.0, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.7, 0.7, 0.7, 1.0]
roughness = 0.5
metallic = 1.0
metallic_roughness = 'project://assets/textures/browser-data-alpha.png'
