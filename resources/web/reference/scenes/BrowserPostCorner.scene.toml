# Task 4 post-effect fixture; native and Web use identical external graphics maps.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.12, 0.12, 0.12]
sun_direction = [-0.4, 0.8, 0.6]
sun_intensity = 2.0
sky_horizon = [0.2, 0.3, 0.5]
sky_zenith = [0.04, 0.12, 0.3]
sky_void = [0.01, 0.02, 0.04]

[[entities]]
name = 'Post qualification camera'
position = [0.0, 1.5, 3.0]
euler = [-8.0, 0.0, 0.0]
[entities.camera]
main = true
projection = 'perspective'
orthographic_height = 8.0
fov = 60.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.0, 0.0, 0.0]

[[entities]]
name = 'Reflective floor'
mesh_renderer = true
position = [0.0, -1.0, -5.0]
euler = [-90.0, 0.0, 0.0]
scale = [12.0, 12.0, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
receive_shadows = false
base_color = [0.65, 0.65, 0.65, 1.0]
emissive = [0.0, 0.0, 0.0]
roughness = 0.05
metallic = 1.0

[[entities]]
name = 'Diffuse back wall'
mesh_renderer = true
position = [0.0, 2.0, -9.0]
euler = [0.0, 0.0, 0.0]
scale = [10.0, 8.0, 1.0]
[entities.mesh]
