# Task 4 authored effect fixture. Fixed camera; comparison uses capture tick 10.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.02, 0.02, 0.02]
sun_direction = [0.2, 0.7, 1.0]
sun_intensity = 1.5
sky_horizon = [0.2, 0.35, 0.6]
sky_zenith = [0.04, 0.12, 0.3]
sky_void = [0.01, 0.02, 0.04]
object_ambient = [0.15, 0.2, 0.1]
object_light0_direction = [0.0, 0.4, 1.0]
object_light0_color = [0.8, 0.1, 0.05]
object_light1_direction = [0.6, -0.2, 0.8]
object_light1_color = [0.1, 0.5, 0.2]

[[entities]]
name = 'Fixed effect camera'
position = [0.0, 0.0, 0.0]
[entities.camera]
main = true
projection = 'perspective'
fov = 60.0
orthographic_height = 8.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.05, 0.06, 0.08]
depth_of_field = true
focus_distance = 2.0
aperture = 0.7
focal_length_mm = 200.0

[[entities]]
name = 'Sharp near emissive square'
mesh_renderer = true
position = [-0.6, 0.0, -2.0]
euler = [0.0, 0.0, 0.0]
scale = [0.8, 0.8, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
roughness = 0.4
receive_shadows = false
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [4.0, 4.0, 4.0]

[[entities]]
name = 'Defocused far emissive square'
mesh_renderer = true
position = [1.8, 0.0, -6.0]
euler = [0.0, 0.0, 0.0]
scale = [2.4, 2.4, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
roughness = 0.4
receive_shadows = false
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [4.0, 4.0, 4.0]

# A real distant surface lets the lens gather outside the bright square. A
# solid camera background is composited after the lens and intentionally stays
# WYSIWYG, so it cannot serve as a bokeh receiver.
[[entities]]
name = 'Distant dark bokeh receiver'
mesh_renderer = true
position = [0.0, 0.0, -20.0]
scale = [40.0, 40.0, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
receive_shadows = false
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [0.0, 0.0, 0.0]
