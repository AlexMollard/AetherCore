# Fixed camera/radiance qualification; effects disabled.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.0, 0.0, 0.0]
sun_direction = [0.0, 0.0, 1.0]
sun_intensity = 0.0
sky_horizon = [0.0, 0.0, 0.0]
sky_zenith = [0.0, 0.0, 0.0]
sky_void = [0.0, 0.0, 0.0]

[[entities]]
name = 'Fixed camera'
position = [0.0, 0.0, 0.0]
[entities.camera]
main = true
projection = 'orthographic'
orthographic_height = 8.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.0, 0.0, 0.0]

[[entities]]
name = 'Half radiance'
mesh_renderer = true
position = [-2.0, 0.0, -2.0]
scale = [2.0, 2.0, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [0.5, 0.5, 0.5]

[[entities]]
name = 'Eight radiance'
mesh_renderer = true
position = [2.0, 0.0, -2.0]
scale = [2.0, 2.0, 1.0]
[entities.mesh]
kind = 'primitive'
path = 'quad'
[entities.material]
double_sided = true
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [8.0, 8.0, 8.0]
