# Task 4 authored effect fixture. Fixed camera; comparison uses capture tick 10.
[scene]
version = 16
kind = '3d'
features = ['meshes_3d', 'lighting_3d']

[environment]
ambient = [0.05, 0.05, 0.05]
sun_direction = [0.0, 0.0, 1.0]
sun_intensity = 3.0
sky_horizon = [0.2, 0.35, 0.6]
sky_zenith = [0.04, 0.12, 0.3]
sky_void = [0.01, 0.02, 0.04]

[[entities]]
name = 'Fixed effect camera'
position = [0.0, 0.0, 0.0]
[entities.camera]
main = true
projection = 'orthographic'
orthographic_height = 8.0
near = 0.1
far = 100.0
background = 'solid_colour'
clear_color = [0.05, 0.06, 0.08]

[[entities]]
name = 'Unlit red foreground cube'
mesh_renderer = true
mesh_renderer_cast_shadows = false
position = [0.0, 0.0, -4.0]
scale = [1.2, 1.2, 1.2]
[entities.mesh]
kind = 'primitive'
path = 'cube'
[entities.material]
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [0.9, 0.1, 0.05]
receive_shadows = false

[[entities]]
name = 'Blue dome nearer than the cube'
mesh_renderer = true
mesh_renderer_cast_shadows = false
position = [0.0, 0.0, -2.0]
scale = [3.0, 3.0, 3.0]
[entities.mesh]
kind = 'primitive'
path = 'sphere'
[entities.material]
double_sided = true
base_color = [0.0, 0.0, 0.0, 1.0]
emissive = [0.05, 0.15, 0.9]
receive_shadows = false
sky = false
