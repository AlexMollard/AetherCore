# AetherCore project file. This IS the project — open it from the launcher.

[project]
version = 1
name = "AetherProject"

[paths]
assets  = "assets"
scenes  = "scenes"
prefabs = "assets/prefabs"
scripts = "scripts"

[app]
startupScene = "default"

[publish]
platformName = "Windows"
productName  = "AetherProject"
buildScripts = true
cleanOutput  = true
openAfter    = true
syncEditorPak = true
usePackageTemplate = true
verifyOutput = true
outputRoot   = ""
